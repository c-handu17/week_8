<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables Operations</title>
</head>
<body>
    <div id="out"></div>
    <script>
        let a = 10, b =10;
        let msg = "";

        msg += "a = "+ a + ", b = "+ b +"<br><br>";
        
        msg += "<b>Arithmetic Operations</b><br>";
        msg += "a + b = " + (a + b) + "<br><br>";
        msg += "a - b = " + (a - b) + "<br><br>";
        msg += "a * b = " + (a * b) + "<br><br>";
        msg += "a / b = " + (a / b).toFixed(2) + "<br><br>";
        msg += "a % b = " + (a % b) + "<br><br>";
        msg += "a ** b = " + (a ** b) + "<br><br>";

        msg += "<b>Comparison Operations</b><br>";
        msg += "a > b : " + (a>b) + "<br><br>";
        msg += "a == b : " + (a==b) + "<br><br>";
        msg += "a === b : " + (a===b) + "<br><br>";

        msg += "<b>Logical</b><br>";
        msg += "(a > 5 && b < 5) : " + (a > 5 && b < 5) + "<br>";
        msg += "(a < 5 || b < 5) : " + (a < 5 || b < 5) + "<br>";
        msg += "!(a > b) : " + !(a > b);

        document.getElementById("out").innerHTML = msg;
    </script>
</body>
</html>
