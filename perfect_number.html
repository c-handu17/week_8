<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Number</title>
</head>
<body>
    <script>
        let number = 6;
        let sum = 0;

        for (let i = 1; i <= number / 2; i++) {
            if (number % i == 0) {
                sum += i;
            }
        }

        if (sum == number && number > 0) {
            document.write("Perfect number");
        } else {
            document.write("Not a perfect number");
        }
    </script>
</body>
</html>
